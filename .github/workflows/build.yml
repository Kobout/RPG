name: Build RPG Batalhas

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compilar
        run: javac -d out -sourcepath src src/view/TelaPrincipal.java

      - name: Criar jar
        run: jar --create --file rpg.jar --main-class view.TelaPrincipal -C out . -C resources .

      - name: Gerar executavel com jpackage
        run: jpackage --input . --name "RPG Batalhas" --main-jar rpg.jar --main-class view.TelaPrincipal --icon app.ico --type app-image --win-console

      - name: Publicar resultado
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Batalhas-Windows
          path: "RPG Batalhas"
